# Changelog gerado a partir dos Conventional Commits (pnpm release).
[changelog]
header = "# Changelog\n\n"
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = "^feat", group = "Funcionalidades" },
  { message = "^fix", group = "Correções" },
  { message = "^perf", group = "Desempenho" },
  { message = "^docs", group = "Documentação" },
  { message = "^(ci|test|style)", skip = true },
  { message = "^(chore|build|refactor)", skip = true },
]
