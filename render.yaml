# Blueprint do Render para a API do NEXO Check.
# O banco é o Postgres gratuito do Neon (região aws-us-east-1, perto do Render "virginia").
# Variáveis com `sync: false` são preenchidas no painel do Render (nunca no repositório).
services:
  - type: web
    name: nexo-check-api
    runtime: node
    plan: free
    region: virginia
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter api build
    # O plano gratuito não tem pre-deploy: as migrações rodam antes de subir o servidor.
    startCommand: pnpm --filter api exec prisma migrate deploy && pnpm --filter api start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
