# Blueprint do Render para a API do NEXO Check.
# O banco é o Postgres gratuito do Neon (região aws-us-east-1, perto do Render "virginia").
# Variáveis com `sync: false` são preenchidas no painel do Render (nunca no repositório).
services:
  - type: web
    name: nexo-check-api
    runtime: node
    plan: free
    region: virginia
    # O corepack embutido no Node 22.12 não conhece as chaves de assinatura atuais do npm.
    # NODE_ENV=production faria o pnpm pular as devDependencies (tsup, prisma) no build.
    buildCommand: npm install -g corepack@latest && corepack enable && NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter api build
    # O plano gratuito não tem pre-deploy: as migrações rodam antes de subir o servidor.
    # Sem pnpm no start: o cache do corepack não é garantido em tempo de execução.
    startCommand: cd apps/api && ./node_modules/.bin/prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: TRUST_PROXY_HOPS
        value: '1'
      # Cabeçalho com o IP real do cliente (ex.: cf-connecting-ip), para o rate limit.
      - key: CLIENT_IP_HEADER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
