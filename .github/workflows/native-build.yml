name: Native build
on:
  workflow_call:
    inputs:
      release-id:
        type: string
        default: ''
      tag:
        type: string
        default: ''
      notes:
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/client/src-tauri/**
      - packages/tauri-plugin-apk-updater/**
      - .github/workflows/native-build.yml
      - .github/actions/setup-android-native/**
      - .github/scripts/android-smoke.sh
permissions:
  contents: write
env:
  VITE_API_URL: https://nexo-check-api.onrender.com
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/client
          tauriScript: pnpm tauri
          releaseId: ${{ inputs.release-id }}
          releaseBody: ${{ inputs.notes }}
      - name: Smoke (abre o app, confere que segue vivo e captura a tela)
        shell: pwsh
        run: |
          $dir = 'apps/client/src-tauri/target/release'
          Get-ChildItem "$dir/*.exe" | ForEach-Object { Write-Host "exe: $($_.Name)" }
          $proc = Start-Process "$dir/nexo-check.exe" -PassThru
          try {
            Start-Sleep -Seconds 20
            if ($proc.HasExited) { throw "O app encerrou sozinho (exit code $($proc.ExitCode))." }
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD/windows-smoke.png")
          } finally {
            # /T encerra também os processos filhos do WebView2.
            if (-not $proc.HasExited) { taskkill /T /F /PID $proc.Id | Out-Null }
          }
      - name: Instalador NSIS silencioso
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'apps/client/src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Instalador NSIS não encontrado.' }
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Instalador saiu com código $($p.ExitCode)." }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-bundle
          path: apps/client/src-tauri/target/release/bundle/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: windows-smoke.png
          if-no-files-found: warn
  android:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.gen.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      # gen/android nasce no bootstrap-native (task android-init). Num push em branch
      # antes disso o job só avisa; em dispatch, tag ou workflow_call a ausência falha.
      - name: Confere gen/android
        id: gen
        run: |
          if [ -d apps/client/src-tauri/gen/android ]; then
            echo present=true >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            echo '::warning::gen/android ainda não existe: rode bootstrap-native com task=android-init.'
            echo present=false >> "$GITHUB_OUTPUT"
          else
            echo '::error::gen/android não existe: rode bootstrap-native com task=android-init.'
            exit 1
          fi
      - if: steps.gen.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gen.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.gen.outputs.present == 'true'
        uses: ./.github/actions/setup-android-native
      - if: steps.gen.outputs.present == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target
      - if: steps.gen.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gen.outputs.present == 'true'
        run: pnpm --filter client tauri android build --apk --target aarch64 --target armv7 --target x86_64
      - name: Localiza, assina (se preciso) e renomeia o APK
        if: steps.gen.outputs.present == 'true'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          dir=apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/release
          apk=$(find "$dir" -name '*.apk' | head -n 1)
          [ -n "$apk" ] || { echo "::error::APK não encontrado em $dir"; exit 1; }
          mkdir -p dist-apk
          if [[ "$apk" == *unsigned* ]]; then
            # Ainda sem keystore (Task 8): chave descartável, só para o smoke.
            bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass smoke-pass -keypass smoke-pass \
              -alias smoke -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=smoke'
            "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:smoke-pass --key-pass pass:smoke-pass \
              --out "dist-apk/nexo-check-$version-smoke.apk" "$RUNNER_TEMP/aligned.apk"
          else
            cp "$apk" "dist-apk/nexo-check-$version.apk"
          fi
          ls -l dist-apk
      - uses: actions/upload-artifact@v4
        if: steps.gen.outputs.present == 'true'
        with:
          name: android-apk
          path: dist-apk/*.apk
          if-no-files-found: error
  android-smoke:
    needs: android
    if: needs.android.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk
      - name: Habilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh "$(ls apk/*.apk | head -n 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: android-smoke.png
          if-no-files-found: warn
