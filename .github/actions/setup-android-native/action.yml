name: Setup Android native
description: JDK 17, Android SDK, NDK e Rust com os targets Android (sem Node/pnpm, que cada job configura).
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    # O padrão da action é "tools platform-tools", mas o pacote "tools" não existe mais no
    # repositório do SDK e o sdkmanager falha ("Failed to find package 'tools'").
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: NDK
      shell: bash
      run: |
        sdkmanager "ndk;27.2.12479018"
        echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
