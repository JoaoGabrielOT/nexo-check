[package]
name = "nexo-check"
version = "0.0.0"
description = "NEXO Check: checklist diário de hábitos do projeto NEXO em Movimento"
edition = "2021"

[lib]
name = "nexo_check_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
